<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motoways - Mapa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .phone-frame {
            width: 375px;
            height: 812px;
            background: #e8e4d9;
            border-radius: 40px;
            padding: 0;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        .map-container {
            width: 100%;
            height: 100%;
            position: relative;
            background: #e8e4d9;
        }

        /* Simulated street map */
        .map-bg {
            width: 100%;
            height: 100%;
            background:
                linear-gradient(45deg, transparent 48%, #c9c5b8 48%, #c9c5b8 52%, transparent 52%),
                linear-gradient(-45deg, transparent 48%, #c9c5b8 48%, #c9c5b8 52%, transparent 52%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            position: relative;
        }

        /* Street overlay */
        .street {
            position: absolute;
            background: #fff;
        }

        .street-h1 {
            top: 180px;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #fff 0%, #D4FF00 30%, #B8E600 50%, #D4FF00 70%, #fff 100%);
        }

        .street-h2 {
            top: 380px;
            left: 0;
            width: 100%;
            height: 3px;
        }

        .street-h3 {
            top: 580px;
            left: 0;
            width: 100%;
            height: 2px;
        }

        .street-v1 {
            top: 0;
            left: 120px;
            width: 3px;
            height: 100%;
        }

        .street-v2 {
            top: 0;
            left: 240px;
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg, #fff 0%, #D4FF00 40%, #B8E600 60%, #fff 100%);
        }

        /* City labels */
        .city-label {
            position: absolute;
            background: rgba(255,255,255,0.95);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            color: #333;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .label-1 { top: 160px; left: 20px; }
        .label-2 { top: 360px; right: 30px; }
        .label-3 { top: 520px; left: 140px; }

        /* GPS position */
        .gps-marker {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 24px;
            height: 24px;
            background: #4A90E2;
            border-radius: 50%;
            border: 4px solid rgba(255,255,255,0.9);
            box-shadow: 0 4px 12px rgba(74,144,226,0.5);
            z-index: 100;
        }

        .gps-marker::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
        }

        .heading-arrow {
            position: absolute;
            top: -16px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 12px solid #4A90E2;
        }

        /* Hazard markers */
        .hazard {
            position: absolute;
            width: 32px;
            height: 32px;
            background: #ff4444;
            border-radius: 50%;
            border: 3px solid #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 2px 8px rgba(255,68,68,0.4);
            z-index: 50;
        }

        .hazard-1 { top: 200px; right: 80px; }
        .hazard-2 { bottom: 300px; left: 60px; }

        /* Search bar */
        .search-bar {
            position: absolute;
            top: 60px;
            left: 20px;
            right: 20px;
            background: rgba(255,255,255,0.98);
            padding: 14px 18px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            font-size: 15px;
            color: #999;
            z-index: 200;
        }

        /* Bottom sheet */
        .bottom-sheet {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: #0a0a0a;
            border-radius: 24px 24px 0 0;
            padding: 20px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.3);
            z-index: 200;
        }

        .sheet-handle {
            width: 40px;
            height: 4px;
            background: #333;
            border-radius: 2px;
            margin: 0 auto 15px;
        }

        .sheet-title {
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .sheet-subtitle {
            color: #999;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .route-btn {
            background: linear-gradient(135deg, #D4FF00 0%, #B8E600 100%);
            color: #0a0a0a;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
        }

        /* Quality overlay legend */
        .legend {
            position: absolute;
            top: 140px;
            right: 20px;
            background: rgba(0,0,0,0.85);
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 10px;
            color: #fff;
            z-index: 150;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
        }

        .legend-color {
            width: 20px;
            height: 3px;
            border-radius: 2px;
        }

        .status-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            color: #333;
            font-size: 13px;
            font-weight: 600;
            z-index: 250;
        }

        a { text-decoration: none; color: inherit; }

        .overview-pill {
            position: fixed;
            top: 16px;
            left: 16px;
            background: #1a1a1a;
            color: #D4FF00;
            border: 1px solid #2a2a2a;
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-decoration: none;
            z-index: 500;
        }
        .overview-pill:hover { background: #2a2a2a; }

        .home-pill {
            position: fixed;
            top: 16px;
            right: 16px;
            background: #1a1a1a;
            color: #fff;
            border: 1px solid #2a2a2a;
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            text-decoration: none;
            z-index: 500;
        }
        .home-pill:hover { background: #2a2a2a; }
    </style>
</head>
<body>
    <a class="overview-pill" href="index.html">← Přehled</a>
    <a class="home-pill" href="01-home.html">🏠 Domů</a>
    <div class="phone-frame">
        <div class="map-container">
            <div class="status-bar">
                <span>9:41</span>
                <span>●●●●● 100%</span>
            </div>

            <div class="map-bg">
                <div class="street street-h1"></div>
                <div class="street street-h2"></div>
                <div class="street street-h3"></div>
                <div class="street street-v1"></div>
                <div class="street street-v2"></div>

                <div class="city-label label-1">Beroun</div>
                <div class="city-label label-2">Křivoklát</div>
                <div class="city-label label-3">Rakovník</div>

                <div class="gps-marker">
                    <div class="heading-arrow"></div>
                </div>

                <div class="hazard hazard-1">⚠️</div>
                <div class="hazard hazard-2">🚧</div>
            </div>

            <div class="search-bar">
                Kam chcete jet?
            </div>

            <div class="legend">
                <div class="legend-item">
                    <div class="legend-color" style="background: #D4FF00;"></div>
                    <span>Kvalitní km</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #fff;"></div>
                    <span>Standardní</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #ff4444;"></div>
                    <span>Rizika</span>
                </div>
            </div>

            <div class="bottom-sheet">
                <div class="sheet-handle"></div>
                <div class="sheet-title">Křivoklátsko Route</div>
                <div class="sheet-subtitle">124 km • 2h 15m • Flow Score 92</div>
                <a class="route-btn" href="04-hud.html" style="display:block;text-align:center;">Spustit navigaci</a>
            </div>
        </div>
    </div>
</body>
</html>
