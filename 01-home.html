<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motoways - Domů</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .phone-frame {
            width: 375px;
            height: 812px;
            background: #0a0a0a;
            border-radius: 40px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            color: #fff;
            font-size: 13px;
        }

        .brand-header {
            text-align: center;
            padding: 30px 20px;
            background: linear-gradient(180deg, #0a0a0a 0%, #1a1a1a 100%);
        }

        .logo {
            font-size: 32px;
            font-weight: 800;
            color: #fff;
            letter-spacing: -1px;
            margin-bottom: 8px;
        }

        .tagline {
            font-size: 12px;
            color: #999;
            letter-spacing: 0.5px;
        }

        .main-cta {
            margin: 30px 20px;
            background: linear-gradient(135deg, #D4FF00 0%, #B8E600 100%);
            color: #0a0a0a;
            padding: 28px;
            border-radius: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
            box-shadow: 0 10px 30px rgba(212, 255, 0, 0.3);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .main-cta:hover {
            transform: scale(1.02);
        }

        .last-ride {
            margin: 20px;
            background: #1a1a1a;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #2a2a2a;
        }

        .last-ride-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .last-ride-title {
            font-size: 14px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .flow-score {
            background: linear-gradient(135deg, #D4FF00 0%, #B8E600 100%);
            color: #0a0a0a;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 16px;
        }

        .ride-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }

        .stat {
            background: #0a0a0a;
            padding: 12px;
            border-radius: 12px;
        }

        .stat-label {
            font-size: 11px;
            color: #666;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 20px;
            color: #fff;
            font-weight: 700;
        }

        .route-name {
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .ride-date {
            color: #666;
            font-size: 13px;
        }

        .secondary-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 20px;
        }

        .action-btn {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            color: #fff;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: #2a2a2a;
            border-color: #3a3a3a;
        }

        .action-icon {
            font-size: 24px;
            margin-bottom: 8px;
        }

        a { text-decoration: none; color: inherit; display: block; }

        .overview-pill {
            position: fixed;
            top: 16px;
            left: 16px;
            background: #1a1a1a;
            color: #D4FF00;
            border: 1px solid #2a2a2a;
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-decoration: none;
            z-index: 100;
        }
        .overview-pill:hover { background: #2a2a2a; }
    </style>
</head>
<body>
    <a class="overview-pill" href="index.html">← Přehled</a>
    <div class="phone-frame">
        <div class="status-bar">
            <span>9:41</span>
            <span>●●●●● 100%</span>
        </div>

        <div class="brand-header">
            <div class="logo">MOTOWAYS</div>
            <div class="tagline">Navigace pro motorkáře. Komunita. Flow.</div>
        </div>

        <a class="main-cta" href="02-map.html">
            KAM DNES
        </a>

        <a class="last-ride" href="05-flow-summary.html" style="cursor:pointer;">
            <div class="last-ride-header">
                <div class="last-ride-title">Poslední jízda</div>
                <div class="flow-score">92</div>
            </div>
            <div class="route-name">Křivoklátsko Loop</div>
            <div class="ride-date">23. května 2026</div>
            <div class="ride-stats">
                <div class="stat">
                    <div class="stat-label">Vzdálenost</div>
                    <div class="stat-value">124 km</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Čas</div>
                    <div class="stat-value">2h 15m</div>
                </div>
            </div>
        </a>

        <div class="secondary-actions">
            <a class="action-btn" href="03-planner.html">
                <div class="action-icon">🗺️</div>
                <div>Plánovač</div>
            </a>
            <a class="action-btn" href="05-flow-summary.html">
                <div class="action-icon">📊</div>
                <div>Historie</div>
            </a>
            <a class="action-btn" href="index.html">
                <div class="action-icon">👥</div>
                <div>Komunita</div>
            </a>
            <a class="action-btn" href="index.html">
                <div class="action-icon">⚙️</div>
                <div>Nastavení</div>
            </a>
        </div>
    </div>
</body>
</html>
