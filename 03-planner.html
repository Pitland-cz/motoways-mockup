<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motoways - Plánovač</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .phone-frame {
            width: 375px;
            height: 812px;
            background: #0a0a0a;
            border-radius: 40px;
            padding: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            color: #fff;
            font-size: 13px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 20px 0;
        }

        .back-btn {
            font-size: 24px;
            cursor: pointer;
        }

        .header-title {
            font-size: 24px;
            font-weight: 800;
            color: #fff;
        }

        .route-inputs {
            background: #1a1a1a;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 0;
            border-bottom: 1px solid #2a2a2a;
        }

        .input-group:last-child {
            border-bottom: none;
        }

        .input-icon {
            font-size: 20px;
            width: 24px;
        }

        .input-field {
            flex: 1;
            background: none;
            border: none;
            color: #fff;
            font-size: 15px;
        }

        .input-field::placeholder {
            color: #666;
        }

        .waypoint-text {
            color: #999;
            font-size: 14px;
        }

        .add-waypoint {
            color: #D4FF00;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            padding: 8px 0;
        }

        .filters-section {
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 13px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .filter-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .chip {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            color: #fff;
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .chip.active {
            background: #D4FF00;
            color: #0a0a0a;
            border-color: #D4FF00;
        }

        .slider-group {
            background: #1a1a1a;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 12px;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            color: #fff;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .slider-value {
            color: #D4FF00;
            font-weight: 700;
        }

        .slider {
            width: 100%;
            height: 4px;
            background: #2a2a2a;
            border-radius: 2px;
            position: relative;
        }

        .slider-fill {
            height: 100%;
            background: linear-gradient(90deg, #D4FF00 0%, #B8E600 100%);
            border-radius: 2px;
            width: 60%;
        }

        .map-preview {
            background: #e8e4d9;
            height: 180px;
            border-radius: 16px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .preview-route {
            position: absolute;
            top: 50%;
            left: 20px;
            right: 20px;
            height: 4px;
            background: linear-gradient(90deg, #4A90E2 0%, #D4FF00 50%, #4A90E2 100%);
            transform: translateY(-50%) rotate(-5deg);
            border-radius: 2px;
        }

        .flow-estimate {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0,0,0,0.85);
            padding: 8px 14px;
            border-radius: 20px;
            color: #D4FF00;
            font-weight: 800;
            font-size: 16px;
        }

        .start-btn {
            background: linear-gradient(135deg, #D4FF00 0%, #B8E600 100%);
            color: #0a0a0a;
            padding: 18px;
            border-radius: 14px;
            text-align: center;
            font-weight: 800;
            font-size: 17px;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(212, 255, 0, 0.25);
        }

        .planner-mode {
            background: #1a1a1a;
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 20px;
            display: flex;
            gap: 8px;
        }

        .mode-btn {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            text-align: center;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            background: #0a0a0a;
            color: #999;
            border: 1px solid #2a2a2a;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #D4FF00 0%, #B8E600 100%);
            color: #0a0a0a;
            border-color: #D4FF00;
        }

        .mode-icon {
            font-size: 20px;
            margin-bottom: 4px;
        }

        .ai-badge {
            display: inline-block;
            background: #D4FF00;
            color: #0a0a0a;
            padding: 2px 8px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
            margin-left: 4px;
        }

        a { text-decoration: none; color: inherit; }

        .home-pill {
            position: fixed;
            top: 16px;
            right: 16px;
            background: #1a1a1a;
            color: #fff;
            border: 1px solid #2a2a2a;
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            z-index: 500;
        }
        .home-pill:hover { background: #2a2a2a; }
    </style>
</head>
<body>
    <a class="home-pill" href="index.html">🏠 Domů</a>
    <div class="phone-frame">
        <div class="status-bar">
            <span>9:41</span>
            <span>●●●●● 100%</span>
        </div>

        <div class="header">
            <a class="back-btn" href="index.html" style="text-decoration:none;color:inherit;">←</a>
            <div class="header-title">Plánovač</div>
        </div>

        <div class="planner-mode">
            <div class="mode-btn active">
                <div class="mode-icon">🤖</div>
                <div>Nechat na AI</div>
            </div>
            <div class="mode-btn">
                <div class="mode-icon">🗺️</div>
                <div>Manuálně</div>
            </div>
        </div>

        <div class="route-inputs">
            <div class="input-group">
                <div class="input-icon">📍</div>
                <input type="text" class="input-field" placeholder="Odkud" value="Praha, Václavské nám.">
            </div>
            <div class="input-group">
                <div class="input-icon">🎯</div>
                <input type="text" class="input-field" placeholder="Kam" value="Křivoklát">
            </div>
            <div class="input-group">
                <div class="input-icon">➕</div>
                <div class="add-waypoint">Přidat zastávku</div>
            </div>
        </div>

        <div class="filters-section">
            <div class="section-title">Preference</div>
            <div class="filter-chips">
                <div class="chip active">Kvalitní silnice</div>
                <div class="chip">Vyhnout se městům</div>
                <div class="chip">Serpentiny</div>
                <div class="chip">Minimalizovat dálnice</div>
            </div>
        </div>

        <div class="filters-section">
            <div class="slider-group">
                <div class="slider-label">
                    <span>Maximální vzdálenost</span>
                    <span class="slider-value">150 km</span>
                </div>
                <div class="slider">
                    <div class="slider-fill" style="width: 60%;"></div>
                </div>
            </div>
            <div class="slider-group">
                <div class="slider-label">
                    <span>Čas jízdy</span>
                    <span class="slider-value">2h 30m</span>
                </div>
                <div class="slider">
                    <div class="slider-fill" style="width: 50%;"></div>
                </div>
            </div>
        </div>

        <div class="map-preview">
            <div class="preview-route"></div>
            <div class="flow-estimate">92</div>
        </div>

        <a class="start-btn" href="04-hud.html" style="display:block;text-align:center;">
            SPUSTIT JÍZDU
        </a>
    </div>
</body>
</html>
